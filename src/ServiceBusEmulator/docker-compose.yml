name: microsoft-azure-servicebus-emulator
services:
  servicebus-emulator:
    container_name: "servicebus-emulator"
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    ports:
      - "5672:5672" # Port for Service Bus
    volumes:
      - ./ConfigFiles/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json 
    environment:
      SQL_SERVER: sqledge # SQL dependency for the emulator
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    depends_on:
      - sqledge # SQL Edge starts first
  sqledge:
    container_name: sqledge
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD} 
    ports:
      - "1433:1433" # SQL Server port
networks:
  default:
    name: sb-emulator